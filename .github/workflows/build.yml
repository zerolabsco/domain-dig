name: Build

# Compile gate and accessibility audit for the GitHub mirror. builds.sr.ht is the
# primary remote for this project but has no macOS images, so xcodebuild cannot
# run there; this job builds and tests on a GitHub-hosted macOS runner instead.
#
# This runs `xcodebuild test`, which also compiles the app, the widget, and the
# share extension (the DomainDig scheme's build action pulls both in as
# dependencies). The test target is DomainDigUITests — an accessibility audit
# suite; see DomainDigUITests/AccessibilityAuditHarness.swift.
#
# The audit REPORTS but does not FAIL by default. It surfaces violations that
# exist today, so gating on it would block every unrelated PR until the
# accessibility pass in issue #21 completes. Findings land in the job log and in
# the uploaded .xcresult bundle, tagged [report] or [FAIL].
#
# Enforcement is a committed constant, not a CI setting: widen
# `AccessibilityAuditHarness.enforcedAuditTypes` as each phase clears a category.
# (Env vars were tried first — neither a plain xcodebuild env var nor a
# TEST_RUNNER_-prefixed build setting reaches the UI test process.)
#
# The matrix runs two simulators because audit coverage is NOT nested — each
# runtime reports findings the other misses, in both directions. Measured
# locally on the Tracked Domains screen, iOS 18.6 reported 2 issues and iOS 27.0
# reported 6 (including contrast and element-detection issues 18.6 never
# raised); at accessibility text sizes the Dashboard produced a hit-region
# finding on 18.6 that 27.0 did not.
#
# CAVEAT — this image cannot test the real support floor. The app's deployment
# target is 17.6, but the macos-26 runner ships only iOS 26.x simulator
# runtimes, so "floor" resolves to ~26.2 here rather than an 18.x image. CI
# therefore compares two 26.x runtimes; genuine oldest-supported-OS coverage has
# to come from a local run or a self-hosted runner with older runtimes
# installed. The "Select simulator" step emits a warning annotation when the
# resolved floor sits well above the deployment target, so this gap stays
# visible instead of being silently assumed away.
#
# Installing an older runtime in CI (xcodebuild -downloadPlatform iOS
# -buildVersion 18.6) is possible but costs several GB and minutes per job; not
# done by default.
#
# Runtimes are resolved dynamically rather than pinned. The previous selector
# took the first iPhone from any runtime, which could pick a simulator BELOW the
# deployment target, where the app cannot install.
#
# pull_request only, plus manual dispatch. GitHub builds the merge result (PR
# merged into main), so a green PR validates exactly what will land on main.
# Note: this repo currently also pushes directly to main for releases, and those
# pushes are NOT gated here — add a `push: { branches: [main] }` trigger below if
# you want direct-to-main commits covered too.
#
# paths-ignore skips prose-only changes. Both globs are single-star, so they
# match the repo root and Docs/ but nothing deeper — a .md that ever lands inside
# a source directory still builds.
on:
  pull_request:
    paths-ignore: ['*.md', 'Docs/*.md']
  workflow_dispatch:

# The job only reads code; drop the default read-write GITHUB_TOKEN scope.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with IPHONEOS_DEPLOYMENT_TARGET in DomainDig.xcodeproj.
  DEPLOYMENT_TARGET_MAJOR: '17'
  DEPLOYMENT_TARGET_MINOR: '6'

jobs:
  test:
    name: xcodebuild test (${{ matrix.tier }})
    # macos-latest still points at macOS 15, which lacks the iOS 26+ SDK this app
    # is built against.
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        # floor   = oldest runtime the app actually supports
        # current = newest runtime available on the image
        tier: [floor, current]

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          floor=$(( DEPLOYMENT_TARGET_MAJOR * 1000 + DEPLOYMENT_TARGET_MINOR ))

          selected=$(xcrun simctl list devices available --json \
            | jq -c --argjson floor "$floor" --arg tier "${{ matrix.tier }}" '
                [ .devices | to_entries[]
                  | (.key | capture("SimRuntime\\.iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)$")) as $v
                  | (($v.maj | tonumber) * 1000 + ($v.min | tonumber)) as $rank
                  | select($rank >= $floor)
                  | .value[]
                  | select(.name | startswith("iPhone"))
                  | { rank: $rank, udid: .udid, name: .name, os: "\($v.maj).\($v.min)" }
                ]
                | sort_by(.rank, .name)
                | if length == 0 then empty
                  elif $tier == "floor" then .[0]
                  else .[-1] end
              ')

          if [ -z "$selected" ]; then
            echo "::error::No iPhone simulator at or above iOS ${DEPLOYMENT_TARGET_MAJOR}.${DEPLOYMENT_TARGET_MINOR} on this image"
            xcrun simctl list devices available >&2
            exit 1
          fi

          label=$(echo "$selected" | jq -r '"\(.name) (iOS \(.os))"')
          echo "Selected $label"
          echo "udid=$(echo "$selected" | jq -r .udid)" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

          # Surface the floor-coverage gap rather than letting the matrix imply
          # coverage it does not have. One major version of slack is tolerated.
          if [ "${{ matrix.tier }}" = "floor" ]; then
            rank=$(echo "$selected" | jq -r .rank)
            if [ "$rank" -ge $(( (DEPLOYMENT_TARGET_MAJOR + 1) * 1000 )) ]; then
              echo "::warning::Floor tier resolved to $label, well above the ${DEPLOYMENT_TARGET_MAJOR}.${DEPLOYMENT_TARGET_MINOR} deployment target. This image has no older runtime, so the oldest supported OS is NOT covered by this run."
            fi
          fi

      - name: Test on ${{ steps.sim.outputs.label }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project DomainDig.xcodeproj \
            -scheme DomainDig \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results
        # Always upload: on success the bundle carries the accessibility burndown
        # list, which is the reason this suite exists.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.tier }}
          path: TestResults.xcresult
          retention-days: 7
